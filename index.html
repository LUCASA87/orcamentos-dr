<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>DR Construções — Orçamentos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --gold:#c8962a;--gold-l:#f0c040;--cream:#fdf6ec;
  --dark:#1c1008;--text:#2e1a0a;
  --blue:#1a5fa8;--blue-h:#0d4a8a;
  --brick:#9b3a1a;--mortar:#b8a288;
  --red:#c0392b;--green:#1a7a3a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Lato',sans-serif;background:var(--dark);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

/* ── BRICK BG ── */
.brick-bg{position:fixed;inset:0;z-index:0;background-color:#6e2e10}
.brick-bg svg{position:absolute;inset:0;width:100%;height:100%;opacity:.88}
.brick-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.05) 0%,rgba(0,0,0,.62) 100%)}

/* ── APP ── */
#app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* ── HEADER ── */
header{border-bottom:2.5px solid var(--gold);background:rgba(12,5,1,.82);backdrop-filter:blur(6px);padding:14px 18px;text-align:center}
.header-title{font-family:'Playfair Display',serif;font-size:1.35rem;color:var(--gold-l);letter-spacing:.5px}
.header-title::after{content:'';display:block;width:55px;height:2px;background:linear-gradient(90deg,var(--gold),var(--brick));margin:7px auto 0;border-radius:2px}
/* ── CARD LOGO ── */
.card-logo-wrap{width:100%;background:rgba(12,5,1,.82);border-bottom:2px solid var(--gold)}
.card-logo-img{width:100%;display:block;object-fit:contain;object-position:center;max-height:72px;padding:8px 16px}
.card-logo-fb{width:100%;padding:14px 0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1c0e04,#3a1a08)}
.card-logo-fb span{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--gold-l);letter-spacing:1px}

/* ── MAIN ── */
main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:18px 10px 28px}
.card{background:rgba(253,246,236,.97);border-top:5px solid var(--gold);border-radius:3px;box-shadow:0 6px 40px rgba(0,0,0,.65);width:100%;max-width:480px;padding:0 0 24px;overflow:hidden}



/* ── PANELS ── */
.panels{padding:14px 14px 0;display:flex;flex-direction:column;gap:14px}
.panel{border-radius:4px;padding:14px 14px 16px;border:1px solid rgba(0,0,0,.08)}
.panel-blue{background:#dceef8;border-color:#a8cde8}
.panel-orange{background:#fde8b4;border-color:#e8c070}
.panel h3{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;margin-bottom:12px;color:var(--text);border-bottom:1.5px solid rgba(0,0,0,.1);padding-bottom:6px}
label{display:block;font-size:.74rem;font-weight:700;color:#555;margin-bottom:3px;text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],input[type=tel]{width:100%;padding:10px 12px;border:1.5px solid #ccc;border-radius:3px;background:#fff;font-size:.95rem;font-family:'Lato',sans-serif;color:var(--text);outline:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,150,42,.15)}
.field{margin-bottom:11px}
.field:last-child{margin-bottom:0}

/* tel formatting hint */
.tel-hint{font-size:.7rem;color:#888;margin-top:3px}

/* ── MAT INPUTS ── */
.mat-input-row{display:grid;grid-template-columns:1fr 96px;gap:8px;margin-bottom:9px}
.btn-add{display:block;width:100%;padding:10px;background:#d4eaf8;border:2px solid #c04040;border-radius:4px;font-size:.88rem;font-weight:700;color:var(--text);cursor:pointer;text-align:center;font-family:'Lato',sans-serif;transition:background .15s;-webkit-tap-highlight-color:transparent}
.btn-add:active{background:#b8d8f0}

/* ── HISTORY ── */
#item-history{margin-top:9px;max-height:190px;overflow-y:auto}
.hist-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.78);border:1px solid rgba(0,0,0,.1);border-radius:3px;padding:7px 9px;margin-bottom:5px;animation:slideIn .22s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
.hist-name{color:var(--text);flex:1;font-weight:600;font-size:.83rem;word-break:break-word}
.hist-val{color:#7a2d10;font-weight:700;font-family:'Playfair Display',serif;font-size:.83rem;min-width:78px;text-align:right;padding:0 6px}
.btn-del{background:none;border:none;color:#c04040;font-size:1rem;cursor:pointer;padding:0;line-height:1;flex-shrink:0}

/* ── TOTAL ── */
.total-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1.5px dashed rgba(0,0,0,.15);font-family:'Playfair Display',serif;font-size:.9rem;color:var(--text)}
.total-bar strong{color:var(--brick);font-size:1rem}

/* ── SUBMIT ── */
.submit-wrap{padding:18px 14px 0}
.btn-submit{display:block;width:100%;padding:16px;background:linear-gradient(135deg,#1a6abd,#0d4a8a);border:2.5px solid var(--gold);border-radius:4px;color:#fff;font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn-submit:active{transform:scale(.99);opacity:.92}

/* ── FOOTER ── */
footer{background:rgba(8,3,1,.92);border-top:1.5px solid var(--gold);color:#666;font-size:.72rem;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(4px)}
footer .copy{color:#888}
footer .by{color:var(--gold);font-style:italic}

/* ══ TOAST ══ */
#toast-container{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:90%;max-width:360px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,.45);font-family:'Lato',sans-serif;font-size:.88rem;font-weight:700;color:#fff;pointer-events:all;animation:toastIn .3s ease forwards;width:100%}
.toast.hide{animation:toastOut .3s ease forwards}
.toast-icon{font-size:1.2rem;flex-shrink:0}
.toast-text{flex:1;line-height:1.35}
.toast.error{background:linear-gradient(135deg,#c0392b,#922b21);border-left:4px solid #ff6b6b}
.toast.warn{background:linear-gradient(135deg,#c87820,#9a5a10);border-left:4px solid var(--gold-l)}
.toast.success{background:linear-gradient(135deg,#1a7a3a,#0f5228);border-left:4px solid #4cff88}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-10px)}}

/* ══ BRICK ANIMATION ══ */
#brick-anim{position:fixed;inset:0;z-index:999;display:none;overflow:hidden}
#brick-anim.active{display:block;pointer-events:all}
#brick-canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.brick-label{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,220,160,.75);font-family:'Playfair Display',serif;font-size:.95rem;letter-spacing:2px;text-align:center;pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ══ SUCCESS ══ */
#success-screen{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(10,4,1,.75);backdrop-filter:blur(4px)}
#success-screen.visible{display:flex}
.success-card{background:var(--cream);border-top:5px solid var(--gold);border-radius:4px;max-width:460px;width:100%;box-shadow:0 10px 50px rgba(0,0,0,.7);text-align:center;animation:fadeUp .45s ease forwards;max-height:92vh;overflow-y:auto;overflow-x:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}


.success-body{padding:20px 18px 24px}
.success-card h2{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--gold);margin-bottom:16px}
.msg-box{background:#fff;border:1.5px solid #e8d0a0;border-radius:4px;padding:14px;text-align:left;font-size:.76rem;line-height:1.78;color:var(--text);white-space:pre-wrap;margin-bottom:18px;word-break:break-word}
.success-btns{display:flex;flex-direction:column;gap:10px}
.btn-whats{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#128c3e,#075e2d);border:2.5px solid #25d366;border-radius:4px;color:#fff;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:.5px;text-decoration:none;text-align:center;-webkit-tap-highlight-color:transparent}
.btn-new{display:block;width:100%;padding:13px;background:linear-gradient(135deg,#a0522d,#7a3b1e);border:2.5px solid var(--gold);border-radius:4px;color:#fff;font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>

<div class="brick-bg">
  <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <pattern id="bp" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse">
        <rect x="1" y="1" width="74" height="16" rx="1" fill="#9b3a1a"/>
        <rect x="1" y="1" width="74" height="3" fill="rgba(255,255,255,0.07)"/>
        <rect x="1" y="13" width="74" height="3" fill="rgba(0,0,0,0.18)"/>
        <rect x="-39" y="22" width="74" height="16" rx="1" fill="#7a2d10"/>
        <rect x="37" y="22" width="74" height="16" rx="1" fill="#b04520"/>
        <rect x="-39" y="22" width="74" height="3" fill="rgba(255,255,255,0.05)"/>
        <rect x="37" y="22" width="74" height="3" fill="rgba(255,255,255,0.09)"/>
      </pattern>
      <filter id="worn"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#bp)"/>
    <rect width="100%" height="100%" fill="rgba(50,12,3,0.22)" filter="url(#worn)"/>
  </svg>
  <div class="brick-overlay"></div>
</div>

<div id="toast-container"></div>

<div id="app">
  <header>
    <div class="header-title">Solicitar Orçamento</div>
  </header>

  <main>
    <div class="card" id="form-card">
      <div class="card-logo-wrap">
        <img class="card-logo-img" id="logo-card"
             src="Logo.png"
             alt="DR Construções"
             onerror="this.style.display='none';document.getElementById('logo-fb-card').style.display='flex'"/>
        <div class="card-logo-fb" id="logo-fb-card" style="display:none"><span>DR Construções</span></div>
      </div>

      <div class="panels">

        <div class="panel panel-blue">
          <h3>🏗️ Registro do Cliente</h3>
          <div class="field">
            <label for="cli-nome">Nome Completo</label>
            <input type="text" id="cli-nome" placeholder="Ex: João da Silva" autocomplete="name"/>
          </div>
          <div class="field">
            <label for="cli-tel">WhatsApp (com DDD)</label>
            <input type="tel" id="cli-tel" placeholder="51 99999-9999" autocomplete="tel" maxlength="13" oninput="maskTel(this)"/>
            <div class="tel-hint">Formato: 51 99999-9999</div>
          </div>
          <div class="field">
            <label for="cli-obs">Observações</label>
            <input type="text" id="cli-obs" placeholder="Ex: Ap. 2 quartos — Pintura externa"/>
          </div>
          <div class="field">
            <label for="cli-mao">Mão de Obra (R$)</label>
            <input type="number" id="cli-mao" placeholder="0,00" step="0.01" min="0"/>
          </div>
        </div>

        <div class="panel panel-orange">
          <h3>🧱 Materiais / Serviços</h3>
          <div class="mat-input-row">
            <div>
              <label for="mat-item">Item</label>
              <input type="text" id="mat-item" placeholder="Ex: Tinta 18L"/>
            </div>
            <div>
              <label for="mat-val">Valor (R$)</label>
              <input type="number" id="mat-val" placeholder="0,00" step="0.01" min="0"/>
            </div>
          </div>
          <button class="btn-add" onclick="addItem()">＋ Adicionar Item</button>
          <div id="item-history"></div>

      </div>

      </div>
    </div>
  </main>

  <footer>
    <span class="copy">© 2025 — DR Construções</span>
    <span class="by">By Lucas Stanguerlin</span>
  </footer>
</div>

<div id="brick-anim">
  <canvas id="brick-canvas"></canvas>
  <div class="brick-label">Preparando orçamento...</div>
</div>

<div id="success-screen">
  <div class="success-card">
    <div class="card-logo-wrap">
      <img class="card-logo-img" id="logo-success"
           src="C:/Users/Micro/Desktop/Trabalhos/Renan/Logo.png"
           alt="DR Construções"
           onerror="this.style.display='none';document.getElementById('logo-fb-s').style.display='flex'"/>
      <div class="card-logo-fb" id="logo-fb-s" style="display:none"><span>DR Construções</span></div>

          💬 &nbsp; Enviar pelo WhatsApp

      </div>

</div>

<script>
// ══ TOAST ══
function toast(msg, type='error', duration=3400){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icons = {error:'⚠️', warn:'🔔', success:'✅'};
  t.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-text">${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{
    t.classList.add('hide');
    setTimeout(()=>t.remove(), 320);
  }, duration);
}

// ══ TEL MASK ══
function maskTel(el){
  let v = el.value.replace(/\D/g,'').slice(0,11);
  if(v.length > 7){
    v = v.slice(0,2)+' '+v.slice(2,7)+'-'+v.slice(7);
  } else if(v.length > 2){
    v = v.slice(0,2)+' '+v.slice(2);
  }
  el.value = v;
}

function rawTel(val){
  return '55' + val.replace(/\D/g,'');
}

function validTel(val){
  return val.replace(/\D/g,'').length >= 10;
}

// ══ ITEMS ══
let items = [], itemId = 0;

document.getElementById('mat-item').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('mat-val').focus();
});
document.getElementById('mat-val').addEventListener('keydown',e=>{
  if(e.key==='Enter') addItem();
});

function addItem(){
  const nEl = document.getElementById('mat-item');
  const vEl = document.getElementById('mat-val');
  const name = nEl.value.trim();
  if(!name){ toast('Digite o nome do item antes de adicionar.','warn'); nEl.focus(); return; }
  const val = vEl.value.trim();
  items.push({id:++itemId, nome:name, valor: val!=='' ? parseFloat(val) : null});
  renderHistory();
  nEl.value=''; vEl.value=''; nEl.focus();
}

function removeItem(id){
  items = items.filter(i=>i.id!==id);
  renderHistory();
}

function renderHistory(){
  const h = document.getElementById('item-history');
  h.innerHTML='';
  items.forEach(it=>{
    const d = document.createElement('div');
    d.className='hist-item';
    const vs = it.valor!==null
      ? 'R$ '+it.valor.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})
      : 'A confirmar';
    d.innerHTML=`<span class="hist-name">${it.nome}</span><span class="hist-val">${vs}</span><button class="btn-del" onclick="removeItem(${it.id})" aria-label="Remover">✕</button>`;
    h.appendChild(d);
  });
  updateTotal();
}

function updateTotal(){
  let total=0, hasVal=false;
  items.forEach(i=>{ if(i.valor!==null){total+=i.valor;hasVal=true;} });
  const bar=document.getElementById('total-bar');
  if(hasVal){
    bar.style.display='flex';
    document.getElementById('total-val').textContent='R$ '+total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  } else {
    bar.style.display='none';
  }
}

// ══ SUBMIT ══
let currentMsg='', currentTel='';

function submitForm(){
  const nome = document.getElementById('cli-nome').value.trim();
  const tel  = document.getElementById('cli-tel').value.trim();
  const obs  = document.getElementById('cli-obs').value.trim();

  if(!nome){ toast('Informe o nome completo do cliente.','error'); return; }
  if(!tel){ toast('Informe o número de WhatsApp do cliente.','error'); return; }
  if(!validTel(tel)){ toast('WhatsApp inválido. Use o formato: 51 99999-9999','warn'); return; }
  if(items.length===0){ toast('Adicione ao menos um item ao orçamento.','warn'); return; }

  const maoRaw = document.getElementById('cli-mao').value.trim();
  const mao = maoRaw !== '' ? parseFloat(maoRaw) : null;

  currentTel = rawTel(tel);

  let total=0, hasVal=false;
  items.forEach(i=>{ if(i.valor!==null){total+=i.valor;hasVal=true;} });
  if(mao!==null){ total+=mao; hasVal=true; }

  let linhas='';
  items.forEach((it,idx)=>{
    if(it.valor!==null){
      linhas+=`• ${it.nome} — R$ ${it.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}\n`;
    } else {
      linhas+=`• ${it.nome}\n`;
    }
  });

  const totalStr = hasVal
    ? 'R$ '+total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})
    : 'A confirmar';

  currentMsg = `Olá, ${nome}! 👋\n\nSegue seu orçamento:\n\n`;
  if(obs) currentMsg += `📋 ${obs}\n\n`;
  currentMsg += `🧱 *Materiais / Serviços:*\n${linhas}`;
  if(mao!==null) currentMsg += `🔨 *Mão de obra:* R$ ${mao.toLocaleString('pt-BR',{minimumFractionDigits:2})}\n`;
  currentMsg += `\n💰 *Total: ${totalStr}*\n\n`;
  currentMsg += `⏳ Válido por 15 dias.\n✅ Qualidade e pontualidade garantidas.\n\n🏗️ *DR Construções*`;

  // display version (sem markdown WhatsApp)
  const displayMsg = currentMsg.replace(/\*/g,'').replace(/_/g,'');
  document.getElementById('msg-box').textContent = displayMsg;

  // set WhatsApp link
  document.getElementById('whats-link').href =
    'https://api.whatsapp.com/send?phone='+currentTel+'&text='+encodeURIComponent(currentMsg);

  startBrickWall();
}

// ══ BRICK ANIMATION ══
function startBrickWall(){
  const overlay = document.getElementById('brick-anim');
  const canvas  = document.getElementById('brick-canvas');
  const ctx     = canvas.getContext('2d');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  overlay.classList.add('active');

  const W=canvas.width, H=canvas.height;
  const BW=62, BH=26, M=4;
  const cols    = Math.ceil(W/(BW+M))+3;
  const numRows = Math.ceil(H/(BH+M))+2;

  const palettes=[
    '#9b3a1a','#b04520','#7a2d10','#c05530','#a03520',
    '#8b3015','#bf4a25','#6e2808','#c84020','#7f3818',
    '#aa4022','#d06040','#723010','#954028','#5c2208'
  ];

  ctx.fillStyle=var_mortar();
  ctx.fillRect(0,0,W,H);

  function var_mortar(){ return '#b8a288'; }

  function drawBrick(x,y,color){
    ctx.fillStyle=color;
    ctx.fillRect(x+1,y+1,BW-2,BH-2);
    // worn patches
    for(let p=0,n=Math.floor(Math.random()*4)+1;p<n;p++){
      ctx.fillStyle='rgba(0,0,0,'+(Math.random()*.2+.04).toFixed(2)+')';
      const pw=Math.random()*20+5, ph=Math.random()*9+2;
      ctx.fillRect(x+1+Math.random()*(BW-2-pw), y+1+Math.random()*(BH-2-ph), pw, ph);
    }
    // clay variation
    for(let s=0,n=Math.floor(Math.random()*3);s<n;s++){
      ctx.fillStyle='rgba(255,190,120,'+(Math.random()*.13+.03).toFixed(2)+')';
      const sw=Math.random()*14+3, sh=Math.random()*7+2;
      ctx.fillRect(x+1+Math.random()*(BW-2-sw), y+1+Math.random()*(BH-2-sh), sw, sh);
    }
    // crack
    if(Math.random()<.38){
      ctx.beginPath();
      ctx.strokeStyle='rgba(0,0,0,'+(Math.random()*.28+.1).toFixed(2)+')';
      ctx.lineWidth=Math.random()<.5?.5:1;
      const cx=x+5+Math.random()*(BW-10), cy=y+3+Math.random()*(BH-6);
      ctx.moveTo(cx,cy);
      ctx.lineTo(cx+Math.random()*16-8, cy+Math.random()*10-5);
      ctx.stroke();
    }
    // highlight top
    ctx.fillStyle='rgba(255,255,255,.07)';
    ctx.fillRect(x+1,y+1,BW-2,3);
    // shadow bottom
    ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.fillRect(x+1,y+BH-4,BW-2,3);
    // shadow left
    ctx.fillStyle='rgba(0,0,0,.11)';
    ctx.fillRect(x+1,y+1,2,BH-2);
  }

  function drawRow(r){
    const y=r*(BH+M);
    const offset=(r%2===0)?0:(BW+M)*.5;
    for(let c=0;c<cols;c++){
      const x=c*(BW+M)-offset;
      drawBrick(x,y,palettes[Math.floor(Math.random()*palettes.length)]);
    }
  }

  let cur=numRows-1;
  function tick(){
    if(cur<0){
      setTimeout(()=>{
        overlay.classList.remove('active');
        ctx.clearRect(0,0,W,H);
        document.getElementById('success-screen').classList.add('visible');
      },320);
      return;
    }
    drawRow(cur); cur--;
    const spd=Math.max(10,44-(numRows-cur)*1.3);
    setTimeout(tick,spd);
  }
  tick();
}

// ══ RESET ══
function resetForm(){
  document.getElementById('success-screen').classList.remove('visible');
  document.getElementById('cli-nome').value='';
  document.getElementById('cli-tel').value='';
  document.getElementById('cli-obs').value='';
  document.getElementById('cli-mao').value='';
  items=[]; renderHistory();
}
</script>
